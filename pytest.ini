[pytest]
# ============================================================
# AI-Enhanced Enterprise Test Automation Framework
# PyTest Configuration
# ============================================================

# ── Test Discovery ──────────────────────────────────────────
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# ── Markers ─────────────────────────────────────────────────
markers =
    smoke: Smoke test suite - critical path validation
    regression: Full regression test suite
    ui: User interface tests using Selenium
    api: API tests using requests library
    database: Database validation tests
    login: Login functionality tests
    registration: User registration tests
    dashboard: Dashboard feature tests
    ecommerce: E-commerce workflow tests
    rbac: Role-based access control tests
    auth: Authentication and authorization tests
    crud: CRUD operation tests
    schema: JSON schema validation tests
    positive: Positive test scenarios
    negative: Negative test scenarios
    slow: Tests that take longer to execute
    fast: Quick tests for rapid feedback
    cross_browser: Cross-browser compatibility tests
    parallel: Tests safe for parallel execution
    ai: AI-powered test validations
    integration: Integration tests

# ── Execution Options ───────────────────────────────────────
addopts =
    -v
    --tb=short
    --strict-markers
    --color=yes
    --html=reports/html-reports/report.html
    --self-contained-html
    --alluredir=reports/allure-results
    --reruns=2
    --reruns-delay=3
    -p no:warnings

# ── Timeouts ────────────────────────────────────────────────
timeout = 60
timeout_method = thread

# ── Logging ─────────────────────────────────────────────────
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
log_file = logs/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(filename)s:%(lineno)d - %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# ── Filter Warnings ─────────────────────────────────────────
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::ResourceWarning
