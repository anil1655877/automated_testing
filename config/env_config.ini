; ============================================================
; AI-Enhanced Enterprise Test Automation Framework
; Environment-specific Configuration (INI format)
; These are DEFAULTS. Override with .env or environment vars.
; ============================================================

[DEFAULT]
browser = chrome
headless = false
implicit_wait = 10
explicit_wait = 20
page_load_timeout = 60
screenshot_on_failure = true
log_level = INFO
max_retries = 2
retry_delay = 3

[DEV]
base_url = https://demoqa.com
api_base_url = https://demoqa.com/api/v1
db_host = localhost
db_port = 3306
db_name = test_automation_dev
log_level = DEBUG
headless = false

[STAGING]
base_url = https://staging.your-app.com
api_base_url = https://staging-api.your-app.com/v1
db_host = staging-db.internal
db_port = 3306
db_name = test_automation_staging
log_level = INFO
headless = true

[PRODUCTION]
base_url = https://your-app.com
api_base_url = https://api.your-app.com/v1
db_host = prod-db.internal
db_port = 3306
db_name = test_automation_prod
log_level = WARNING
headless = true
