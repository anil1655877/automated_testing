# ============================================================
# GitHub Actions: Nightly Full Regression (Scheduled)
# ============================================================
# Runs complete suite every night at midnight (IST = 18:30 UTC)
# Includes: UI + API + DB + Performance + Security
# ============================================================

name: 🌙 Nightly Full Regression

on:
  schedule:
    # Run at 18:30 UTC = midnight IST (Mon-Fri)
    - cron: '30 18 * * 1-5'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        default: 'staging'
        type: choice
        options: [dev, staging]

env:
  PYTHON_VERSION: "3.11"
  HEADLESS: "true"
  AI_ENABLED: "true"
  USE_MOCK_AI: "true"
  SCREENSHOT_ON_FAILURE: "true"

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false   # Never cancel nightly — let it finish

jobs:

  # ────────────────────────────────────────────────────────────
  # Full UI Suite (Chrome + Firefox)
  # ────────────────────────────────────────────────────────────
  nightly-ui:
    name: 🌐 UI Tests — ${{ matrix.browser }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - uses: browser-actions/setup-chrome@v1
        if: matrix.browser == 'chrome'
        with:
          chrome-version: stable

      - uses: browser-actions/setup-firefox@v1
        if: matrix.browser == 'firefox'
        with:
          firefox-version: latest

      - name: Create directories and .env
        run: |
          mkdir -p reports/html-reports reports/allure-results reports/screenshots logs
          cat > .env << EOF
          ENVIRONMENT=${{ github.event.inputs.environment || 'staging' }}
          BROWSER=${{ matrix.browser }}
          HEADLESS=true
          BASE_URL=https://demoqa.com
          TEST_USERNAME=${{ secrets.TEST_USERNAME || 'testuser_demo' }}
          TEST_PASSWORD=${{ secrets.TEST_PASSWORD || 'Test@12345' }}
          AI_ENABLED=true
          USE_MOCK_AI=true
          SCREENSHOT_ON_FAILURE=true
          EOF

      - name: Run full UI regression — ${{ matrix.browser }}
        run: |
          pytest tests/ui/ \
            -n 2 \
            --tb=short \
            -v \
            --reruns=2 \
            --reruns-delay=3 \
            --html=reports/html-reports/nightly_${{ matrix.browser }}.html \
            --self-contained-html \
            --alluredir=reports/allure-results \
            -p no:warnings
        continue-on-error: true

      - name: Upload UI reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-ui-${{ matrix.browser }}
          path: reports/
          retention-days: 30

  # ────────────────────────────────────────────────────────────
  # Full API Suite
  # ────────────────────────────────────────────────────────────
  nightly-api:
    name: 🌐 API Tests (Full)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: Setup
        run: |
          mkdir -p reports/html-reports reports/allure-results logs
          echo "ENVIRONMENT=dev" > .env
          echo "BASE_URL=https://demoqa.com" >> .env
          echo "AI_ENABLED=true" >> .env
          echo "USE_MOCK_AI=true" >> .env
      - name: Run API tests
        run: |
          pytest tests/api/ \
            --tb=short -v \
            --html=reports/html-reports/nightly_api.html \
            --self-contained-html \
            --alluredir=reports/allure-results
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-api-reports
          path: reports/
          retention-days: 30

  # ────────────────────────────────────────────────────────────
  # DB Suite with MySQL
  # ────────────────────────────────────────────────────────────
  nightly-db:
    name: 🗄️ Database Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: RootPass@123
          MYSQL_DATABASE: test_automation_db
          MYSQL_USER: automation_user
          MYSQL_PASSWORD: AutomationDB@123
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -pRootPass@123"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: Setup
        run: |
          mkdir -p reports/html-reports reports/allure-results logs
          cat > .env << EOF
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_NAME=test_automation_db
          DB_USER=automation_user
          DB_PASSWORD=AutomationDB@123
          AI_ENABLED=true
          USE_MOCK_AI=true
          EOF
      - name: Run DB tests
        run: |
          pytest tests/database/ \
            --tb=short -v \
            --html=reports/html-reports/nightly_db.html \
            --self-contained-html \
            --alluredir=reports/allure-results
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-db-reports
          path: reports/
          retention-days: 30

  # ────────────────────────────────────────────────────────────
  # Security & Performance
  # ────────────────────────────────────────────────────────────
  nightly-security:
    name: 🔒 Security & Performance
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt
      - uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - name: Setup
        run: |
          mkdir -p reports/html-reports reports/allure-results logs
          echo "BROWSER=chrome" > .env
          echo "HEADLESS=true" >> .env
          echo "BASE_URL=https://demoqa.com" >> .env
          echo "AI_ENABLED=true" >> .env
          echo "USE_MOCK_AI=true" >> .env
      - name: Run security tests
        run: |
          pytest tests/ -m "security or performance" \
            --tb=short -v \
            --html=reports/html-reports/nightly_security.html \
            --self-contained-html \
            --alluredir=reports/allure-results
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-security-reports
          path: reports/
          retention-days: 30

  # ────────────────────────────────────────────────────────────
  # Nightly Summary Report
  # ────────────────────────────────────────────────────────────
  nightly-summary:
    name: 📊 Nightly Summary
    runs-on: ubuntu-latest
    needs: [nightly-ui, nightly-api, nightly-db, nightly-security]
    if: always()

    steps:
      - name: Nightly Summary
        run: |
          echo "## 🌙 Nightly Regression Summary — $(date -u '+%Y-%m-%d')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Suite | Browser | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| UI Tests | Chrome  | ${{ needs.nightly-ui.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| UI Tests | Firefox | ${{ needs.nightly-ui.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| API Tests | — | ${{ needs.nightly-api.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| DB Tests | MySQL | ${{ needs.nightly-db.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security | Chrome | ${{ needs.nightly-security.result }} |" >> $GITHUB_STEP_SUMMARY
