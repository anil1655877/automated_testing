# ============================================================
# AI-Enhanced Enterprise Test Automation Framework
# GitHub Actions: Full Regression Workflow
# ============================================================
# Triggers: Push to main/develop, PR to main, Manual dispatch
# Runs: Smoke → Regression → API → DB → Reports
# ============================================================

name: 🚀 Full Regression Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      browser:
        description: 'Browser to use'
        required: false
        default: 'chrome'
        type: choice
        options: [ chrome, firefox ]
      test_suite:
        description: 'Test suite to run'
        required: false
        default: 'regression'
        type: choice
        options: [ smoke, regression, api, database, all ]
      environment:
        description: 'Target environment'
        required: false
        default: 'dev'
        type: choice
        options: [ dev, staging ]
      parallel_workers:
        description: 'Parallel workers (-1 = auto)'
        required: false
        default: '2'

# ── Cancel redundant runs ─────────────────────────────────────
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  BROWSER: ${{ github.event.inputs.browser || 'chrome' }}
  ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}
  HEADLESS: "true"
  AI_ENABLED: "true"
  USE_MOCK_AI: "true"
  SELF_HEALING_ENABLED: "true"
  SCREENSHOT_ON_FAILURE: "true"
  LOG_LEVEL: "INFO"
  PARALLEL_WORKERS: ${{ github.event.inputs.parallel_workers || '2' }}

jobs:

  # ────────────────────────────────────────────────────────────
  # JOB 1: Setup & Lint
  # ────────────────────────────────────────────────────────────
  lint:
    name: 🔍 Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Lint Tools
        run: pip install flake8 black isort

      - name: Run Flake8
        run: |
          flake8 . \
            --max-line-length=120 \
            --exclude=.venv,__pycache__,reports,logs,*.egg-info \
            --ignore=E501,W503,E302 \
            --count --statistics || true

      - name: Check Black Formatting
        run: black --check --diff . --exclude='/(\.venv|reports|logs)/' || true

  # ────────────────────────────────────────────────────────────
  # JOB 2: Smoke Tests
  # ────────────────────────────────────────────────────────────
  smoke-tests:
    name: 💨 Smoke Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Cache Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Create Required Directories
        run: mkdir -p reports/html-reports reports/allure-results reports/screenshots logs

      - name: Create .env File
        run: |
          cat > .env << EOF
          ENVIRONMENT=${{ env.ENVIRONMENT }}
          BROWSER=${{ env.BROWSER }}
          HEADLESS=${{ env.HEADLESS }}
          BASE_URL=https://demoqa.com
          API_BASE_URL=https://demoqa.com
          TEST_USERNAME=${{ secrets.TEST_USERNAME || 'testuser_demo' }}
          TEST_PASSWORD=${{ secrets.TEST_PASSWORD || 'Test@12345' }}
          DB_HOST=localhost
          DB_PORT=3306
          DB_NAME=test_automation_db
          DB_USER=root
          DB_PASSWORD=${{ secrets.DB_PASSWORD || '' }}
          AI_ENABLED=${{ env.AI_ENABLED }}
          USE_MOCK_AI=${{ env.USE_MOCK_AI }}
          SELF_HEALING_ENABLED=${{ env.SELF_HEALING_ENABLED }}
          SCREENSHOT_ON_FAILURE=${{ env.SCREENSHOT_ON_FAILURE }}
          LOG_LEVEL=${{ env.LOG_LEVEL }}
          EOF

      - name: Run Smoke Tests
        run: |
          pytest tests/ -m smoke \
            --tb=short \
            -v \
            --reruns=2 \
            --reruns-delay=3 \
            --html=reports/html-reports/smoke_report.html \
            --self-contained-html \
            --alluredir=reports/allure-results \
            -p no:warnings
        continue-on-error: false

      - name: Upload Smoke Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-reports
          path: |
            reports/html-reports/
            reports/allure-results/
            reports/screenshots/
            logs/
          retention-days: 7

  # ────────────────────────────────────────────────────────────
  # JOB 3: Regression Tests (Parallel)
  # ────────────────────────────────────────────────────────────
  regression-tests:
    name: 🔄 Regression Tests
    runs-on: ubuntu-latest
    needs: smoke-tests
    if: |
      github.event.inputs.test_suite == 'regression' ||
      github.event.inputs.test_suite == 'all' ||
      github.event.inputs.test_suite == null

    strategy:
      fail-fast: false
      matrix:
        test-group: [ ui, api ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Create Directories & .env
        run: |
          mkdir -p reports/html-reports reports/allure-results reports/screenshots logs
          cat > .env << EOF
          ENVIRONMENT=dev
          BROWSER=chrome
          HEADLESS=true
          BASE_URL=https://demoqa.com
          API_BASE_URL=https://demoqa.com
          TEST_USERNAME=${{ secrets.TEST_USERNAME || 'testuser_demo' }}
          TEST_PASSWORD=${{ secrets.TEST_PASSWORD || 'Test@12345' }}
          AI_ENABLED=true
          USE_MOCK_AI=true
          SCREENSHOT_ON_FAILURE=true
          EOF

      - name: Run ${{ matrix.test-group }} Tests
        run: |
          pytest tests/${{ matrix.test-group }}/ \
            -m regression \
            -n ${{ env.PARALLEL_WORKERS }} \
            --tb=short \
            -v \
            --reruns=2 \
            --reruns-delay=3 \
            --alluredir=reports/allure-results \
            --html=reports/html-reports/${{ matrix.test-group }}_report.html \
            --self-contained-html \
            -p no:warnings
        continue-on-error: true

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-${{ matrix.test-group }}-reports
          path: reports/
          retention-days: 14

  # ────────────────────────────────────────────────────────────
  # JOB 4: Database Tests
  # ────────────────────────────────────────────────────────────
  database-tests:
    name: 🗄️ Database Tests
    runs-on: ubuntu-latest
    needs: smoke-tests

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: RootPass@123
          MYSQL_DATABASE: test_automation_db
          MYSQL_USER: automation_user
          MYSQL_PASSWORD: AutomationDB@123
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -pRootPass@123"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Create .env with MySQL Config
        run: |
          mkdir -p reports/html-reports reports/allure-results logs
          cat > .env << EOF
          ENVIRONMENT=dev
          BROWSER=chrome
          HEADLESS=true
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_NAME=test_automation_db
          DB_USER=automation_user
          DB_PASSWORD=AutomationDB@123
          AI_ENABLED=true
          USE_MOCK_AI=true
          EOF

      - name: Run Database Tests
        run: |
          pytest tests/database/ \
            --tb=short \
            -v \
            --alluredir=reports/allure-results \
            --html=reports/html-reports/db_report.html \
            --self-contained-html

      - name: Upload DB Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: database-test-reports
          path: reports/
          retention-days: 7

  # ────────────────────────────────────────────────────────────
  # JOB 5: Publish Allure Report
  # ────────────────────────────────────────────────────────────
  publish-report:
    name: 📊 Publish Reports
    runs-on: ubuntu-latest
    needs: [ smoke-tests, regression-tests, database-tests ]
    if: always()

    steps:
      - name: Download All Reports
        uses: actions/download-artifact@v4
        with:
          path: all-reports/
          merge-multiple: true

      - name: Generate Allure Report
        uses: simple-elf/allure-report-action@master
        if: always()
        with:
          allure_results: all-reports/allure-results
          allure_history: allure-history
          keep_reports: 20

      - name: Publish Allure Report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history

      - name: Post Summary
        if: always()
        run: |
          echo "## 📊 Test Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Smoke Tests     | ${{ needs.smoke-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Regression      | ${{ needs.regression-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Database Tests  | ${{ needs.database-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Browser:** \`${{ env.BROWSER }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** \`${{ env.ENVIRONMENT }}\`" >> $GITHUB_STEP_SUMMARY
